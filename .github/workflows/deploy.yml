# Optional manual deploy via GitHub Actions.
# Production deploys use Cloudflare Workers Builds (dashboard Git integration).
# Push-trigger disabled to avoid failed runs when CLOUDFLARE_* secrets are unset.

name: Deploy jettoptx-aaron-hedgehog

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci || npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
