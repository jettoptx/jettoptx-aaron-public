name = "jettoptx-aaron-public"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-06-11"
compatibility_flags = [
  "nodejs_compat",
  "nodejs_compat_populate_process_env"
]

[vars]
AARON_ORIGIN = "https://aaron.jettoptics.ai"
HEDGEHOG_ORIGIN = "https://hedgehog.jettoptics.ai"
SPACETIME_HTTP_URL = "https://stdb.jettoptics.ai/v1/database/jettchat"
ENV = "production"
CORS_DEV_DOMAINS = ""
CORS_PROD_DOMAINS = "https://*.jettoptics.ai,https://*.jettoptx.chat,https://jettoptx.chat,https://www.jettoptx.chat,https://jettoptx.vercel.app,https://grok.com,https://*.grok.com,https://x.ai,https://*.x.ai,capacitor://localhost,http://localhost:*"

# Secrets (dashboard → Worker → Settings → Secrets — never commit values):
#   MCP_API_KEY              — static admin MCP key (Bearer / X-JOE-Token)
#   MCP_OAUTH_SIGNING_KEY    — optional; SuperGrok MCP OAuth JWTs (else derived from MCP_API_KEY)
#   SHIELD4_ALLOWLIST_JSON   — X OAuth username → { twinId, wallet?, email?, founderBypass? }
#                              Empty/unset = fail-closed for X OAuth only
#   HELIUS_MAINNET_RPC       — optional paid RPC; code falls back to public mainnet-beta
#   CF_ACCESS_CLIENT_ID      — optional; Cloudflare Access service token (with SECRET below)
#   CF_ACCESS_CLIENT_SECRET  — optional; both required for Access headers on SpacetimeDB fetches
#   XAI_API_KEY              — optional; prefer keeping model keys on origin AARON
#   HEDGEHOG_INBOX_URL       — optional; message_joe webhook (HTTPS). Pair with KEY.
#   HEDGEHOG_INBOX_KEY       — optional; Bearer for the inbox POST. Never commit.
#   JOE_INBOX_URL            — optional alias for HEDGEHOG_INBOX_URL
#   JOE_INBOX_KEY            — optional alias for HEDGEHOG_INBOX_KEY
#   If inbox URL+key are unset, message_joe still acks and does not wake Joe.

[limits]
cpu_ms = 300_000

# Phase 0: zone route (not custom_domain) — attach mcp.jettoptics.ai via Workers route.
# If deploy still fails, remove this block and add domain in dashboard → Worker → Domains.
[[routes]]
pattern = "mcp.jettoptics.ai/*"
zone_name = "jettoptics.ai"

# Prefer aaron.jettoptics.ai as the live x402 door. Exact paths only — do not
# steal /x402/v1/* (chat, gaze, task stay on origin / 5ct4 faucet).
[[routes]]
pattern = "aaron.jettoptics.ai/x402"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/x402/"
zone_name = "jettoptics.ai"

# Emergency faucet drain kill-switch. claim* / sol* only — do NOT use
# aaron.jettoptics.ai/* or /faucet/* (would steal unrelated aaron routes).
# No new DNS records and no custom_domain.
[[routes]]
pattern = "aaron.jettoptics.ai/faucet/claim*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/faucet/sol*"
zone_name = "jettoptics.ai"

# Exact FastAPI docs doors on aaron (no host-wide steal). /docs/oauth2-redirect
# stays origin-side for the joe-aaron-router durable PR.
[[routes]]
pattern = "aaron.jettoptics.ai/docs"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/docs/"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/redoc"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/redoc/"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/openapi.json"
zone_name = "jettoptics.ai"

# Emergency leftover-mutator kill-switch (totp enroll fire). path* only —
# do NOT use aaron.jettoptics.ai/* or /jett/* / /gaze* / /handshake* /
# /orphan* (would steal login bootstrap and x402 doors).
# Leave /session, /jett/totp/challenge, /jett/challenge/create on origin.
# No new DNS records and no custom_domain.
[[routes]]
pattern = "aaron.jettoptics.ai/jett/totp/enroll*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/jett/totp/verify*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/gaze/analyze*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/poa/claim*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/donations/claim*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/handshake/start*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/handshake/done*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/hermesync/pair*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/jett/challenge/scanned*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/orphan/claim*"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/audit/devnet*"
zone_name = "jettoptics.ai"

