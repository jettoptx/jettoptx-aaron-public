name = "jettoptx-aaron-hedgehog"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-06-11"
compatibility_flags = [
  "nodejs_compat",
  "nodejs_compat_populate_process_env"
]

[vars]
AARON_ORIGIN = "https://aaron.jettoptics.ai"
HEDGEHOG_ORIGIN = "https://hedgehog.jettoptics.ai"
ENV = "production"
CORS_DEV_DOMAINS = ""
CORS_PROD_DOMAINS = "https://*.jettoptics.ai,https://*.jettoptx.chat,https://jettoptx.chat,https://www.jettoptx.chat,https://jettoptx.vercel.app,capacitor://localhost,http://localhost:*"

[limits]
cpu_ms = 300_000

# AARON attestation + gaze gateway
[[routes]]
pattern = "aaron.jettoptics.ai"
zone_name = "jettoptics.ai"
custom_domain = true

# HEDGEHOG MCP + Grok proxy (gated — JOE API tokens)
[[routes]]
pattern = "mcp.jettoptics.ai"
zone_name = "jettoptics.ai"
custom_domain = true
