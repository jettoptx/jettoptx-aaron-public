name = "jettoptx-aaron-public"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-06-11"
compatibility_flags = [
  "nodejs_compat",
  "nodejs_compat_populate_process_env"
]

[vars]
AARON_ORIGIN = "https://aaron.jettoptics.ai"
HEDGEHOG_ORIGIN = "https://hedgehog.jettoptics.ai"
SPACETIME_HTTP_URL = "https://stdb.jettoptics.ai/v1/database/jettchat"
ENV = "production"
CORS_DEV_DOMAINS = ""
CORS_PROD_DOMAINS = "https://*.jettoptics.ai,https://*.jettoptx.chat,https://jettoptx.chat,https://www.jettoptx.chat,https://jettoptx.vercel.app,capacitor://localhost,http://localhost:*"

# Secrets (dashboard → Worker → Settings → Secrets — never commit values):
#   MCP_API_KEY              — static admin MCP key (Bearer / X-JOE-Token)
#   SHIELD4_ALLOWLIST_JSON   — X OAuth username → { twinId, wallet?, email?, founderBypass? }
#                              Empty/unset = fail-closed for X OAuth only
#   HELIUS_MAINNET_RPC       — optional paid RPC; code falls back to public mainnet-beta
#   CF_ACCESS_CLIENT_ID      — optional; Cloudflare Access service token (with SECRET below)
#   CF_ACCESS_CLIENT_SECRET  — optional; both required for Access headers on SpacetimeDB fetches
#   XAI_API_KEY              — optional; prefer keeping model keys on origin AARON
# MCP OAuth 2.1 for SuperGrok /joe/hedgehog is stateless HMAC using MCP_API_KEY.
# Do not add X client secrets or mesh keys here. Do not enable Helius on this Worker.

[limits]
cpu_ms = 300_000

# Phase 0: zone route (not custom_domain) — attach mcp.jettoptics.ai via Workers route.
# If deploy still fails, remove this block and add domain in dashboard → Worker → Domains.
[[routes]]
pattern = "mcp.jettoptics.ai/*"
zone_name = "jettoptics.ai"

# Prefer aaron.jettoptics.ai as the live x402 door. Exact paths only — do not
# steal /x402/v1/* (chat, gaze, task stay on origin / 5ct4 faucet).
[[routes]]
pattern = "aaron.jettoptics.ai/x402"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/x402/"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/x402/prima_title"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/x402/prima_title/"
zone_name = "jettoptics.ai"

# Public JOB-SPEC URI for agenc.ag/create. Exact paths only — never 402.
[[routes]]
pattern = "aaron.jettoptics.ai/specs/prima-depin-job.json"
zone_name = "jettoptics.ai"

[[routes]]
pattern = "aaron.jettoptics.ai/specs/prima-depin-job.json/"
zone_name = "jettoptics.ai"
